services:
  # Backend Express API Service
  - type: web
    name: sportz-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false # User will input their Neon database URL on Render
      - key: ARCJET_KEY
        sync: false # User will input their Arcjet key on Render
      - key: ARCJET_ENV
        value: production
      - key: ARCJET_MODE
        value: DRY_RUN

  # Frontend Vite React Static Site
  - type: web
    name: sportz-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Dynamic rewrite for React SPA client-side routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sportz-backend
          property: host
